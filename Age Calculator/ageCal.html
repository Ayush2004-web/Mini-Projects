<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./ageCal.css" />
  </head>
  <body>
    
    <div class="w-25 bg-light rounded shadow border mx-auto mt-5 p-4">
    <h4 class="text-center mb-3">Age Calculator</h4>
    <form  class="d-flex flex-column gap-3 align-items-center w-100 p-3">
        <label for="DOB">Enter your Date Of Birth</label>
        <input type="date" name="DOB" id="DOB">
        <label for="currentDate">Choose Current Date</label>
        <input type="Date" name="currentDate" id="currentDate">
        <button type="submit" class="btn btn-primary">Calculate Age</button>
    </form>

    <div class="text-center fw-bold">
        Your Age is : <span id="MyAge">XX</span>
    </div>
    </div>

    <!-- scripts -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./ageCal.js"></script>
  </body>
</html>
