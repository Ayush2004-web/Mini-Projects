<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess The Number</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./numer.css" />
  </head>
  <body>
    <div class="container mt-4">
      <h1 class="display-3 fw-bold">Guess The Number</h1>
      <p class="fs-2 mt-4">
        We have selected a random number between 1 - 10. See if you can guess
        it.
      </p>
      <div class="d-flex align-items-center mt-4 gap-2">
        <label class="fs-2"> Enter a guess: </label>

        <input
          type="number"
          id="guess"
          min="1"
          max="10"
          class="form-control w-25 fs-3"
        />

        <button class="btn btn-secondary btn-lg" onclick="checkGuess()">
          Submit guess
        </button>
      </div>
      <h2 id="message" class="mt-4 text-primary"></h2>
    </div>
    <script src="./number.js"></script>
  </body>
</html>
