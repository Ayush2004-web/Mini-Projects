<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Manager</title>
     <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
</head>
<body class="bg-dark text-light">

    <header class="bg-primary text-light p-3 text-center">
        <div class="d-flex justify-content-between">
        <h1>Password Manager</h1>
        <div class="d-flex gap-5">
            <a href="./showPassword.html" class="text-decoration-none text-white fs-5"> Add New Password</a>
            <a href="./showPassword.html" class="text-decoration-none text-white fs-5"> Viw Saved Password</a>
        </div>
        </div>
        
    </header>

    <main>
        <div class="h-50 mx-auto rounded border p-3 mt-4">
            <form>
                <input type="text" name="siteName" id="siteName" placeholder="Enter the web-site Name :" class="form-control">
                <br>
                <input type="text" name="userName" id="userName" placeholder="Enter the User-Name :" class="form-control">
                <br>
                 <input type="text" name="password" id="password" placeholder="Enter the Password :" class="form-control">
                 <br>
                 <div class="flex gap-3 justify-content-center">
                    <button type="submit" class="btn btn-outline-primary">Save</button>
                    <button type="reset" class="btn btn-outline-danger">Clear</button>
                 </div>
            </form>

        </div>
    </main>

        <!-- scripts -->
     <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
     <script src="./todo.js"></script>
    
</body>
</html>
