<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tip Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./tip.css" />
  </head>

  <body>
    <div class="main-container ">
      <div class="heading-box">
        <h1>TIP CALCULATOR</h1>
      </div>
      <div class="calculator-box">
        <div class="mb-4">
          <label class="form-label custom-label">Bill Amount</label>
          <div class="bill-input-box">
            <input
              type="number"
              id="billAmount"
              class="form-control custom-input"
              placeholder="Enter Bill Amount"
            />
            <span class="rupee-sign">₹</span>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label custom-label"> How was the service ? </label>
          <select id="service" class="form-select custom-select">
            <option value="">Select</option>
            <option value="0.25">25% - Top Notch</option>
            <option value="0.20">20% - Excellent</option>
            <option value="0.15">15% - Good</option>
            <option value="0.10">10% - Bad</option>
            <option value="0.05">5% - Worst</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="form-label custom-label">Total Number Of People </label>
          <input
            type="number"
            id="people"
            class="form-control custom-input"
            placeholder="Enter Number Of People"
          />
        </div>
        <button class="btn calculate-btn" onclick="calculateTip()">
          Calculate
        </button>
        <div id="resultBox" class="result-box">
          <h3>Each Person Should Pay</h3>
          <h1>₹<span id="finalAmount">0</span></h1>
        </div>
      </div>
    </div>
    <!--Scripts-->
    <script src="./tip.js"></script>
  </body>
</html>
