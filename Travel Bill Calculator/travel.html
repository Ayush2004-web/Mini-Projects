<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Bill Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./travel.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
      <div class="col-lg-7 col-md-9 col-12">
        <iv class="card shadow-lg border-0 main-card">
            <div class="card-header text-center">
              <h1 class="title">Travel Bill Calculator</h1>
            </div>
            <div class="card-body p-4">
              <div class="mb-3">
                <label class="form-label fw-bold fs-5">
                  Enter Kilometers Covered
                </label>
                <input
                  type="number"
                  step="0.01"
                  id="km"
                  class="form-control form-control-lg"
                  placeholder="Enter Kilometers"
                />
                <div id="error" class="text-danger mt-2 fw-bold"></div>
              <button
                class="btn btn-lg w-100"onclick="calculateBill()">Calculate Bill</button>
              <div class="card result-card mt-4" id="resultCard">
                <div class="card-body">
                  <h3 class="text-center mb-4">Travel Bill Details</h3>
                  <div class="total-box mb-4">
                    Total Bill =<span id="totalBill"> Rs. 0 </span>
</div>
                  <div id="breakdown"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript File -->
    <script src="./travel.js"></script>
  </body>
</html>
