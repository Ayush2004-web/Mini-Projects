<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator - Web Static App PRD</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./calll.css">
  </head>
  <body>
    <!-- main -->
    <div class="main-bg d-flex justify-content-center align-items-center">

        <div class="calculator">
            <div class="display-box">
                <input type="text" id="display" value="0" readonly>
            </div>
            <!-- buttons -->
            <div class="button-area">

                <button class="btn-circle btn-light-custom" onclick="calculate('AC')">AC</button>
                <button class="btn-circle btn-light-custom" onclick="calculate('AC')">C</button>
                <button class="btn-circle btn-light-custom" onclick="calculate('%')">%</button>
                <button class="btn-circle btn-orange" onclick="calculate('/')">/</button>

                <button class="btn-circle btn-light-custom" onclick="calculate('7')">7</button>
                <button class="btn-circle btn-light-custom" onclick="calculate('8')">8</button>
                <button class="btn-circle btn-light-custom" onclick="calculate('9')">9</button>
                <button class="btn-circle btn-orange" onclick="calculate('*')">*</button>

                <button class="btn-circle btn-light-custom" onclick="calculate('4')">4</button>
                <button class="btn-circle btn-light-custom" onclick="calculate('5')">5</button>
                <button class="btn-circle btn-light-custom" onclick="calculate('6')">6</button>
                <button class="btn-circle btn-orange" onclick="calculate('-')">-</button>

                <button class="btn-circle btn-light-custom" onclick="calculate('1')">1</button>
                <button class="btn-circle btn-light-custom" onclick="calculate('2')">2</button>
                <button class="btn-circle btn-light-custom" onclick="calculate('3')">3</button>
                <button class="btn-circle btn-orange" onclick="calculate('+')">+</button>

                <button class="btn-circle btn-light-custom" onclick="calculate('0')">0</button>
                <button class="btn-circle btn-light-custom" onclick="calculate('.')">.</button>

                <button class="equal-btn" onclick="calculateResult()">=</button>

            </div>

        </div>

    </div>

    <!-- Scripts -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
     <script src="./calll.js"></script>
    </body>
</html>
